<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberGuard AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">🛡️</div>
      <div>
        <h1>CyberGuard AI</h1>
        <p>Cybersecurity Awareness & Safety Assistant</p>
      </div>
    </header>

    <main id="chatBox">
      <div class="message bot">
        <strong>CyberGuard AI</strong>
        <p>Hi! 👋 Ask me any cybersecurity question about phishing, scams, passwords, malware, privacy, online payments, or account safety.</p>
      </div>
    </main>

    <div class="suggestions">
      <button onclick="useQuestion('How can I identify a phishing message?')">🎣 Phishing</button>
      <button onclick="useQuestion('How do I create a strong password?')">🔐 Password</button>
      <button onclick="useQuestion('What should I do if my account is hacked?')">🚨 Hacked Account</button>
      <button onclick="useQuestion('How can I stay safe from online scams?')">🛡️ Scam Safety</button>
    </div>

    <form id="chatForm">
      <input id="messageInput" type="text" placeholder="Ask a cybersecurity question..." autocomplete="off" required>
      <button type="submit">Send ➤</button>
    </form>

    <footer>CyberGuard AI • For cybersecurity awareness and defensive education</footer>
  </div>

<script>
const form = document.getElementById("chatForm");
const input = document.getElementById("messageInput");
const chatBox = document.getElementById("chatBox");

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = "message " + sender;
  const title = sender === "bot" ? "CyberGuard AI" : "You";
  div.innerHTML = "<strong>" + title + "</strong><p></p>";
  div.querySelector("p").textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function useQuestion(q) {
  input.value = q;
  input.focus();
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  addMessage(message, "user");
  input.value = "";

  const typing = document.createElement("div");
  typing.className = "message bot";
  typing.id = "typing";
  typing.innerHTML = "<strong>CyberGuard AI</strong><p>Thinking...</p>";
  chatBox.appendChild(typing);
  chatBox.scrollTop = chatBox.scrollHeight;

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message})
    });
    const data = await res.json();
    document.getElementById("typing")?.remove();
    addMessage(data.reply || "No response received.", "bot");
  } catch (err) {
    document.getElementById("typing")?.remove();
    addMessage("Unable to connect to the server. Please try again.", "bot");
  }
});
</script>
</body>
</html>
